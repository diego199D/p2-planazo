<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planazo – Registrarse</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="auth-bg">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">📅</span>
      <h1 class="logo-title">PLANAZO</h1>
      <p class="logo-sub">Organiza. Vota. Planifica.</p>
    </div>

    <h2 class="auth-heading">Crear cuenta</h2>

    <div id="mensaje-error" class="mensaje-error" style="display:none;"></div>
    <div id="mensaje-exito" class="mensaje-exito" style="display:none;"></div>

    <form id="form-registro" novalidate>
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          placeholder="Juan García"
          autocomplete="name"
          required
        />
        <span class="campo-error" id="error-nombre"></span>
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          name="correo"
          placeholder="tu@correo.com"
          autocomplete="email"
          required
        />
        <span class="campo-error" id="error-correo"></span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-password-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
            required
          />
          <button type="button" class="toggle-pass" aria-label="Mostrar/ocultar contraseña" onclick="togglePass('password', this)">👁</button>
        </div>
        <span class="campo-error" id="error-password"></span>
      </div>

      <div class="form-group">
        <label for="confirmar_password">Confirmar contraseña</label>
        <div class="input-password-wrap">
          <input
            type="password"
            id="confirmar_password"
            name="confirmar_password"
            placeholder="Repite tu contraseña"
            autocomplete="new-password"
            required
          />
          <button type="button" class="toggle-pass" aria-label="Mostrar/ocultar contraseña" onclick="togglePass('confirmar_password', this)">👁</button>
        </div>
        <span class="campo-error" id="error-confirmar"></span>
      </div>

      <button type="submit" class="btn btn-primario btn-full" id="btn-submit">
        Registrarse
      </button>
    </form>

    <p class="auth-link">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </p>
  </div>

  <script src="js/registro.js"></script>
</body>
</html>
